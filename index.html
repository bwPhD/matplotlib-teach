<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="东南大学AI-MUST核心课程：大数据分析与计算社会学。负责人：东南大学社会学系 汪斌。"
  />
  <title>东南大学AI-MUST核心课程 | 大数据分析与计算社会学</title>
  <style>
    :root {
      --ink: #0d1726;
      --muted: #586474;
      --line: rgba(13, 23, 38, 0.12);
      --surface: rgba(255, 255, 255, 0.96);
      --accent: #8c1515;
      --accent-dark: #621010;
      --shadow: 0 18px 48px rgba(13, 23, 38, 0.11);
      --streamlit-embed-footer-h: 30px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background: linear-gradient(135deg, #faf8f5 0%, #f5f1eb 48%, #f8fafc 100%);
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100dvh;
      padding: 12px;
      gap: 12px;
    }

    .masthead {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      padding: 22px 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(140, 21, 21, 0.055), rgba(255, 255, 255, 0) 48%),
        var(--surface);
      box-shadow: 0 12px 40px rgba(13, 23, 38, 0.08);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .monogram {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      box-shadow: 0 12px 26px rgba(140, 21, 21, 0.18);
      font-weight: 800;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(22px, 2.8vw, 40px);
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: 0;
    }

    .course-title {
      margin: 6px 0 0;
      color: var(--ink);
      font-size: clamp(15px, 1.7vw, 24px);
      font-weight: 780;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .meta-panel {
      display: grid;
      gap: 6px;
      min-width: 250px;
      padding: 16px 18px;
      border: 1px solid rgba(140, 21, 21, 0.13);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.74);
    }

    .meta-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .meta-value {
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.45;
    }

    .classroom {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100% + var(--streamlit-embed-footer-h));
      min-height: calc(600px + var(--streamlit-embed-footer-h));
      border: 0;
      background: #fff;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .site-shell {
        grid-template-rows: auto minmax(720px, 1fr);
      }

      .masthead {
        grid-template-columns: 1fr;
      }

      .meta-panel {
        min-width: 0;
      }

      iframe {
        min-height: calc(720px + var(--streamlit-embed-footer-h));
      }
    }

    @media (max-width: 640px) {
      .site-shell {
        padding: 8px;
        gap: 8px;
      }

      .masthead {
        padding: 16px;
      }

      .brand {
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 12px;
      }

      .monogram {
        width: 44px;
        height: 44px;
        font-size: 13px;
      }

      .subtitle,
      .course-title,
      .meta-value {
        font-size: 14px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="site-shell">
    <header class="masthead" aria-label="课程信息">
      <div class="brand">
        <div class="monogram" aria-hidden="true">AI</div>
        <div>
          <h1>东南大学AI-MUST核心课程</h1>
          <p class="course-title">大数据分析与计算社会学</p>
        </div>
      </div>

      <aside class="meta-panel" aria-label="课程负责人">
        <span class="meta-label">负责人</span>
        <span class="meta-value">东南大学社会学系 汪斌</span>
      </aside>
    </header>

    <section id="classroom" class="classroom" aria-label="交互式 Streamlit 教学页面">
      <iframe
        title="东南大学AI-MUST核心课程：大数据分析与计算社会学"
        src="https://matplotlib-teach.streamlit.app/?embed=true&embed_options=show_padding"
        allow="clipboard-read; clipboard-write; fullscreen"
        scrolling="yes"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </section>
  </main>
</body>
</html>
