<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="东南大学AI-MUST核心课程：大数据分析与计算社会学。负责人：东南大学社会学系 汪斌。"
  />
  <title>东南大学AI-MUST核心课程 | 大数据分析与计算社会学</title>
  <style>
    :root {
      --ink: #0d1726;
      --muted: #586474;
      --line: rgba(13, 23, 38, 0.12);
      --surface: rgba(255, 255, 255, 0.92);
      --accent: #0f766e;
      --accent-2: #b7791f;
      --shadow: 0 20px 60px rgba(13, 23, 38, 0.14);
      --header-h: 112px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 18%, rgba(15, 118, 110, 0.16), transparent 28%),
        radial-gradient(circle at 86% 8%, rgba(183, 121, 31, 0.16), transparent 22%),
        linear-gradient(135deg, #f7f4ee 0%, #eef5f4 42%, #f8fafc 100%);
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-shell {
      display: grid;
      grid-template-rows: var(--header-h) minmax(0, 1fr);
      min-height: 100dvh;
      padding: 12px;
      gap: 12px;
    }

    .masthead {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 12px 40px rgba(13, 23, 38, 0.08);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .monogram {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(145deg, #0d9488, #1f2937);
      box-shadow: 0 12px 26px rgba(15, 118, 110, 0.24);
      font-weight: 800;
      letter-spacing: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.12;
      font-weight: 850;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .meta-panel {
      display: grid;
      gap: 6px;
      min-width: 270px;
      padding: 14px 16px;
      border: 1px solid rgba(15, 118, 110, 0.18);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.08), rgba(183, 121, 31, 0.08));
    }

    .meta-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .meta-value {
      color: var(--ink);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 15px;
      border: 1px solid rgba(15, 118, 110, 0.22);
      border-radius: 8px;
      background: #fff;
      color: #0f766e;
      font-size: 14px;
      font-weight: 760;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 118, 110, 0.42);
      box-shadow: 0 10px 24px rgba(13, 23, 38, 0.11);
    }

    .button.primary {
      border-color: transparent;
      background: #0f766e;
      color: #fff;
    }

    .classroom {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .classroom::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, #0f766e, #b7791f, #1f2937);
      z-index: 1;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: calc(100dvh - var(--header-h) - 36px);
      border: 0;
      background: #fff;
    }

    .fallback {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      border: 1px solid rgba(13, 23, 38, 0.12);
      background: rgba(255, 255, 255, 0.9);
      color: var(--muted);
      box-shadow: 0 10px 28px rgba(13, 23, 38, 0.12);
      backdrop-filter: blur(14px);
    }

    .fallback:hover {
      color: var(--ink);
    }

    @media (max-width: 980px) {
      :root {
        --header-h: auto;
      }

      body {
        overflow: auto;
      }

      .site-shell {
        grid-template-rows: auto minmax(720px, 1fr);
      }

      .masthead {
        grid-template-columns: 1fr;
      }

      .meta-panel {
        min-width: 0;
      }

      iframe {
        min-height: 720px;
      }
    }

    @media (max-width: 640px) {
      .site-shell {
        padding: 8px;
        gap: 8px;
      }

      .masthead {
        padding: 16px;
      }

      .brand {
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 12px;
      }

      .monogram {
        width: 44px;
        height: 44px;
        font-size: 13px;
      }

      .subtitle,
      .meta-value {
        font-size: 14px;
      }

      .actions {
        flex-wrap: wrap;
      }

      .button {
        width: 100%;
      }

      .fallback {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="site-shell">
    <header class="masthead" aria-label="课程信息">
      <div class="brand">
        <div class="monogram" aria-hidden="true">AI</div>
        <div>
          <p class="eyebrow">东南大学AI-MUST核心课程</p>
          <h1>大数据分析与计算社会学</h1>
          <p class="subtitle">面向社会科学研究的数据可视化、计算方法与交互式图表训练平台。</p>
        </div>
      </div>

      <aside class="meta-panel" aria-label="课程负责人">
        <span class="meta-label">负责人</span>
        <span class="meta-value">东南大学社会学系 汪斌</span>
        <div class="actions">
          <a class="button primary" href="#classroom">进入课堂</a>
          <a class="button" href="https://matplotlib-teach.streamlit.app/?embed=true" target="_blank" rel="noopener">独立打开</a>
        </div>
      </aside>
    </header>

    <section id="classroom" class="classroom" aria-label="交互式 Streamlit 教学页面">
      <iframe
        title="东南大学AI-MUST核心课程：大数据分析与计算社会学"
        src="https://matplotlib-teach.streamlit.app/?embed=true"
        allow="clipboard-read; clipboard-write; fullscreen"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
      <a class="button fallback" href="https://matplotlib-teach.streamlit.app/?embed=true" target="_blank" rel="noopener">
        打开完整课堂
      </a>
    </section>
  </main>
</body>
</html>
