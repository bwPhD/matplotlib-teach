<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="东南大学AI-MUST核心课程：大数据分析与计算社会学。负责人：东南大学社会学系 汪斌。Python数据可视化、Matplotlib、Seaborn、Plotly交互式教学平台。" />
  <title>大数据分析与计算社会学 | 东南大学 AI-MUST</title>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Design tokens ────────────────────────────────── */
    :root {
      --red:        #8c1515;
      --red-dark:   #621010;
      --red-faint:  rgba(140,21,21,.07);
      --ink:        #0d1726;
      --ink-2:      #374151;
      --muted:      #6b7280;
      --border:     rgba(13,23,38,.10);
      --bg:         #faf8f5;
      --surface:    #ffffff;
      --gold:       #b9975b;
      --shadow-sm:  0 1px 3px rgba(13,23,38,.06), 0 4px 12px rgba(13,23,38,.05);
      --shadow-md:  0 4px 16px rgba(13,23,38,.09), 0 1px 3px rgba(13,23,38,.06);
      --radius-sm:  8px;
      --radius-md:  12px;
      --gap:        12px;
      --header-h:   auto;
      --footer-crop: 32px;   /* hides Streamlit's "Built with Streamlit" footer */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Shell grid ───────────────────────────────────── */
    .shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100dvh;
      gap: var(--gap);
      padding: var(--gap);
    }

    /* ── Header ───────────────────────────────────────── */
    .header {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 20px;
      padding: 18px 24px;
      background:
        linear-gradient(100deg, var(--red-faint) 0%, transparent 52%),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    /* subtle decorative stripe */
    .header::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--red) 0%, var(--gold) 100%);
      border-radius: var(--radius-md) 0 0 var(--radius-md);
    }

    /* ── Brand (logo + text) ──────────────────────────── */
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .logo {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      background: linear-gradient(145deg, var(--red), var(--red-dark));
      box-shadow: 0 8px 20px rgba(140,21,21,.22);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .5px;
      color: #fff;
    }

    .brand-text { min-width: 0; }

    .brand-sup {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
      white-space: nowrap;
    }
    .badge-red   { background: rgba(140,21,21,.10); color: var(--red); }
    .badge-gold  { background: rgba(185,151,91,.14); color: #7a5c1e; }
    .badge-blue  { background: rgba(59,130,246,.10); color: #1d4ed8; }

    .brand-title {
      font-size: clamp(17px, 2.2vw, 26px);
      font-weight: 800;
      color: var(--red);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      margin-top: 3px;
      font-size: clamp(13px, 1.5vw, 16px);
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Meta card (right side) ───────────────────────── */
    .meta-card {
      flex-shrink: 0;
      display: grid;
      gap: 10px;
      padding: 14px 18px;
      border: 1px solid rgba(140,21,21,.13);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,.80);
      backdrop-filter: blur(12px);
      min-width: 220px;
    }

    .meta-row {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .meta-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meta-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
    }

    .divider { width: 100%; height: 1px; background: var(--border); }

    /* ── Chapter strip ────────────────────────────────── */
    .chapters {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 2px;
      margin-top: 10px;
    }
    .chapters::-webkit-scrollbar { display: none; }

    .chapters-label {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .4px;
      text-transform: uppercase;
      margin-right: 2px;
    }

    .ch-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
      background: rgba(13,23,38,.05);
      border: 1px solid var(--border);
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .ch-pill:hover { background: var(--red-faint); color: var(--red); border-color: rgba(140,21,21,.18); }

    /* ── App frame ────────────────────────────────────── */
    .app-frame {
      position: relative;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      min-height: 0;
    }

    /* Loading shimmer */
    .app-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,.6) 50%,
        rgba(255,255,255,0) 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity .4s;
    }
    .app-frame.loading::before { opacity: 1; }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    iframe {
      display: block;
      width: 100%;
      /* crop the Streamlit footer */
      height: calc(100% + var(--footer-crop));
      min-height: calc(620px + var(--footer-crop));
      border: 0;
      background: var(--surface);
    }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 960px) {
      body { overflow: auto; }

      .shell { grid-template-rows: auto minmax(680px,1fr); }

      .header { grid-template-columns: 1fr; }

      .meta-card { min-width: 0; }

      .brand-title { white-space: normal; font-size: 17px; }
      .brand-sub { white-space: normal; font-size: 13px; }

      iframe { min-height: calc(680px + var(--footer-crop)); }
    }

    @media (max-width: 600px) {
      :root { --gap: 8px; }

      .header { padding: 14px 16px; }

      .logo { width: 44px; height: 44px; font-size: 13px; }

      .brand { gap: 12px; }

      .chapters { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- ── Header ──────────────────────────────────────── -->
  <header class="header" aria-label="课程信息">

    <div>
      <div class="brand">
        <div class="logo" aria-hidden="true">AI</div>

        <div class="brand-text">
          <div class="brand-sup">
            <span class="badge badge-red">AI-MUST 核心课程</span>
            <span class="badge badge-blue">AI实验室</span>
          </div>
          <div class="brand-title">大数据分析与计算社会学</div>
          <div class="brand-sub">东南大学 · Southeast University</div>
        </div>
      </div>

      <!-- chapter pills -->
      <nav class="chapters" aria-label="课程章节">
        <span class="chapters-label">章节</span>
        <span class="ch-pill">生态全景</span>
        <span class="ch-pill">核心解构</span>
        <span class="ch-pill">基础笔触</span>
        <span class="ch-pill">布局美学</span>
        <span class="ch-pill">进阶画廊</span>
        <span class="ch-pill">其他库实战</span>
        <span class="ch-pill">大师之路</span>
        <span class="ch-pill">可视化策略</span>
      </nav>
    </div>

    <!-- instructor meta -->
    <aside class="meta-card" aria-label="课程负责人">
      <div class="meta-row">
        <span class="meta-label">负责人</span>
        <span class="meta-value">汪斌</span>
      </div>
      <div class="divider"></div>
      <div class="meta-row">
        <span class="meta-label">单位</span>
        <span class="meta-value">东南大学社会学系</span>
      </div>
    </aside>

  </header>

  <!-- ── Streamlit app ────────────────────────────────── -->
  <main class="app-frame loading" id="appFrame" aria-label="交互式教学平台">
    <iframe
      id="appIframe"
      title="大数据分析与计算社会学 — 交互式教学平台"
      src="https://matplotlib-teach.streamlit.app/?embed=true&embed_options=show_padding"
      allow="clipboard-read; clipboard-write; fullscreen"
      scrolling="yes"
      referrerpolicy="no-referrer-when-downgrade"
      onload="document.getElementById('appFrame').classList.remove('loading')">
    </iframe>
  </main>

</div>

</body>
</html>
